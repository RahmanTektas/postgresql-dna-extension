name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-all

      - name: Build extension
        run: make -C dna_sequence
