name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: postgres:16-bookworm

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential postgresql-server-dev-16 clang llvm

      - name: Build extension
        run: make -C dna_sequence
